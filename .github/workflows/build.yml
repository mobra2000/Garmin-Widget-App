name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 24.04 bringt das Android-SDK bereits mit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK prüfen
        id: sdk
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android-SDK vorhanden: $ANDROID_HOME"
            echo "present=true" >> "$GITHUB_OUTPUT"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android-SDK installieren (falls nicht vorhanden)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk GarminWidget.apk

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GarminWidget
          path: GarminWidget.apk

      - name: Als Release "latest" veröffentlichen (zum Download aufs Handy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GarminWidget.apk \
            --title "Garmin Widget (neuester Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Auf dem Handy herunterladen und installieren." \
            --prerelease
