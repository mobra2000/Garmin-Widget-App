name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    # Ubuntu 24.04 bringt das Android-SDK bereits mit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK prüfen
        id: sdk
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android-SDK vorhanden: $ANDROID_HOME"
            echo "present=true" >> "$GITHUB_OUTPUT"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android-SDK installieren (falls nicht vorhanden)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk GarminWidget.apk

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GarminWidget
          path: GarminWidget.apk

      - name: Als Release "latest" veröffentlichen (zum Download aufs Handy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GarminWidget.apk \
            --title "Garmin Widget (neuester Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Auf dem Handy herunterladen und installieren." \
            --prerelease

      - name: Fehlerbericht als Issue speichern (nur bei Fehlern)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch build.log
          {
            echo "Build ${GITHUB_SHA::7} fehlgeschlagen."
            echo '```'
            grep -n -E '^e: |error:|What went wrong|FAILED|Exception|Could not' build.log | head -80
            echo '--- Ende des Logs ---'
            tail -60 build.log
            echo '```'
          } > report.md
          num=$(gh issue list --label build-log --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$num" ]; then
            gh label create build-log --color B60205 2>/dev/null || true
            gh issue create --title "Build-Log" --label build-log --body-file report.md
          else
            gh issue comment "$num" --body-file report.md
          fi
